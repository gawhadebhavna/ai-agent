[project]
name = "fastapi-migration-automation"
version = "0.1.0"
description = "FastAPI + LangChain + LangGraph automation service for migration operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-ollama>=0.2.0",
  "ollama>=0.3.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "httpx>=0.28.0",
  "openai>=1.0.0",
  "azure-storage-blob>=12.0.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
